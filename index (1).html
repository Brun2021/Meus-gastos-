<script>
  // Local storage shim: mirrors the window.storage.get/set API the app uses,
  // but persists to this browser's localStorage instead of Claude's cloud storage.
  window.storage = {
    async get(key, shared) {
      try {
        const raw = localStorage.getItem("pm_erp_" + key);
        if (raw === null) return null;
        return { key: key, value: raw, shared: !!shared };
      } catch (e) { throw e; }
    },
    async set(key, value, shared) {
      try {
        localStorage.setItem("pm_erp_" + key, value);
        return { key: key, value: value, shared: !!shared };
      } catch (e) { return null; }
    },
    async delete(key, shared) {
      try {
        localStorage.removeItem("pm_erp_" + key);
        return { key: key, deleted: true, shared: !!shared };
      } catch (e) { return null; }
    },
    async list(prefix, shared) {
      try {
        const p = "pm_erp_" + (prefix || "");
        const keys = Object.keys(localStorage).filter(function (k) { return k.indexOf(p) === 0; })
          .map(function (k) { return k.slice(7); });
        return { keys: keys, prefix: prefix, shared: !!shared };
      } catch (e) { return null; }
    }
  };
</script>

/* ---- Lightweight dependency-free bar chart (replaces recharts for standalone use) ---- */
function SimpleBarChart({ data, xKey, yKey, color, height = 220, valueFormatter }) {
  const values = data.map(d => Number(d[yKey]) || 0);
  const max = Math.max(1, ...values);
  const n = Math.max(1, data.length);
  const chartH = height - 26;
  return (
    <div style={{ width: "100%" }}>
      <svg viewBox={`0 0 ${n * 40} ${chartH}`} preserveAspectRatio="none" style={{ width: "100%", height: chartH, overflow: "visible" }}>
        <line x1="0" y1={chartH - 0.5} x2={n * 40} y2={chartH - 0.5} stroke={BRAND.border} strokeWidth="1" />
        {data.map((d, i) => {
          const v = Number(d[yKey]) || 0;
          const h = max > 0 ? (v / max) * (chartH - 14) : 0;
          const x = i * 40 + 8;
          const w = 24;
          const y = chartH - h;
          return (
            <g key={i}>
              <title>{`${d[xKey]}: ${valueFormatter ? valueFormatter(v) : v}`}</title>
              <rect x={x} y={y} width={w} height={Math.max(h, 1)} rx="3" fill={color} />
            </g>
          );
        })}
      </svg>
      <div style={{ display: "flex", marginTop: 6 }}>
        {data.map((d, i) => (
          <div key={i} style={{ flex: 1, textAlign: "center", fontSize: 10.5, color: BRAND.mutedDark }}>{d[xKey]}</div>
        ))}
      </div>
    </div>
  );
}

function formatKz(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("pt-PT", { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + " Kz";
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function formatDatePT(iso) {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

function stockStatus(p) {
  if (p.stockAtual <= p.stockMin) return "baixo";
  if (p.stockAtual >= p.stockMax) return "alto";
  return "normal";
}

function seedFaturas(produtos) {
  const p = produtos;
  const mk = (offsetDays, numero, cliente, itensDef) => {
    const d = new Date();
    d.setDate(d.getDate() - offsetDays);
    const data = d.toISOString().slice(0, 10);
    const itens = itensDef.map(([idx, qtd]) => ({
      produtoId: p[idx].id,
      nome: p[idx].nome,
      precoUnit: p[idx].preco,
      qtd,
      subtotal: p[idx].preco * qtd,
    }));
    const total = itens.reduce((s, i) => s + i.subtotal, 0);
    return { id: uid(), numero, data, cliente, itens, total, estado: "Emitida" };
  };
  return [
    mk(0, "FAT-2026-0001", "Cliente Balcão", [[0, 2], [6, 10]]),
    mk(1, "FAT-2026-0002", "João Sacramento", [[2, 1], [3, 1]]),
    mk(3, "FAT-2026-0003", "Cliente Balcão", [[7, 20], [4, 1]]),
  ];
}

/* ---------------- Small UI atoms ---------------- */

function Badge({ color, children }) {
  return (
    <span
      className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium"
      style={{ background: `${color}1A`, color }}
    >
      <span className="w-1.5 h-1.5 rounded-full" style={{ background: color }} />
      {children}
    </span>
  );
}

function Card({ children, className = "", style = {} }) {
  return (
    <div
      className={`rounded-2xl p-5 ${className}`}
      style={{ background: BRAND.surface, border: `1px solid ${BRAND.border}`, ...style }}
    >
      {children}
    </div>
  );
}

  const styles = {
    primary: { background: `linear-gradient(135deg, ${BRAND.gold}, ${BRAND.goldLight})`, color: "#1A1200" },
    secondary: { background: BRAND.surface2, color: BRAND.text, border: `1px solid ${BRAND.borderStrong}` },
    danger: { background: "rgba(248,113,113,0.12)", color: BRAND.danger, border: `1px solid rgba(248,113,113,0.3)` },
    ghost: { background: "transparent", color: BRAND.muted },
  };
  return (
    <button type={type} title={title} disabled={disabled} onClick={onClick} className={`${base} ${className}`} style={styles[variant]}>
      {children}
    </button>
  );
}

function Input({ label, ...props }) {

        style={{ background: BRAND.surface2, border: `1px solid ${BRAND.borderStrong}`, color: BRAND.text }}
      />

function Select({ label, children, ...props }) {

      <select

function Modal({ title, onClose, children, wide }) {

/* Stock gauge — signature element: current level between min/max markers */
function StockGauge({ p, compact }) {
  const status = stockStatus(p);
  const max = Math.max(p.stockMax, p.stockAtual, 1);
  const pct = Math.min(100, (p.stockAtual / max) * 100);
  const minPct = Math.min(100, (p.stockMin / max) * 100);
  const maxPct = Math.min(100, (p.stockMax / max) * 100);
  return (
    <div style={{ width: compact ? 110 : "100%" }}>
      <div className="relative h-2 rounded-full overflow-hidden" style={{ background: BRAND.surface3 }}>
        <div
          className="absolute inset-y-0 left-0 rounded-full"
          style={{ width: `${pct}%`, background: `linear-gradient(90deg, ${BRAND.blueDark}, ${STATUS_COLOR[status]})` }}
        />
        <div className="absolute inset-y-0 w-px" style={{ left: `${minPct}%`, background: "rgba(255,255,255,0.5)" }} />
        <div className="absolute inset-y-0 w-px" style={{ left: `${maxPct}%`, background: "rgba(255,255,255,0.5)" }} />
      </div>
      {!compact && (
        <div className="flex justify-between mt-1.5" style={{ color: BRAND.mutedDark, fontSize: 11 }}>
          <span>Mín {p.stockMin}</span>
          <span>{p.stockAtual} {p.unidade}</span>
          <span>Máx {p.stockMax}</span>
        </div>
      )}
    </div>
  );
}

/* ---------------- App ---------------- */

function App() {
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const [view, setView] = useState("dashboard");
  const [produtos, setProdutos] = useState([]);
  const [faturas, setFaturas] = useState([]);
  const [usuarios, setUsuarios] = useState([]);
  const [invoiceCounter, setInvoiceCounter] = useState(1);

  const [productModal, setProductModal] = useState(null); // {} new, {...} edit, null closed
  const [invoiceModal, setInvoiceModal] = useState(false);
  const [userModal, setUserModal] = useState(null);
  const [printingInvoice, setPrintingInvoice] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null); // {type, id, label}

  const firstLoad = useRef(true);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const data = JSON.parse(res.value);
          setProdutos(data.produtos || []);
          setFaturas(data.faturas || []);
          setUsuarios(data.usuarios || []);
          setInvoiceCounter(data.invoiceCounter || 1);
        } else {
          const p = seedProdutos();
          setProdutos(p);
          setUsuarios(seedUsuarios());
          setFaturas(seedFaturas(p));
          setInvoiceCounter(4);
        }
      } catch (e) {
        const p = seedProdutos();
        setProdutos(p);
        setUsuarios(seedUsuarios());
        setFaturas(seedFaturas(p));
        setInvoiceCounter(4);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    if (firstLoad.current) { firstLoad.current = false; return; }
    (async () => {
      try {
        const payload = JSON.stringify({ produtos, faturas, usuarios, invoiceCounter });
        const r = await window.storage.set(STORAGE_KEY, payload, false);
        setSaveError(!r);
      } catch (e) {
        setSaveError(true);
      }
    })();
  }, [produtos, faturas, usuarios, invoiceCounter, loaded]);

  async function resetDemo() {
    const p = seedProdutos();
    setProdutos(p);
    setUsuarios(seedUsuarios());
    setFaturas(seedFaturas(p));
    setInvoiceCounter(4);
    setConfirmDelete(null);
  }

  /* ---------- derived dashboard data ---------- */
  const today = todayISO();
  const monthPrefix = today.slice(0, 7);

  const vendasHoje = useMemo(() => faturas.filter(f => f.data === today).reduce((s, f) => s + f.total, 0), [faturas, today]);
  const receitaMes = useMemo(() => faturas.filter(f => f.data.startsWith(monthPrefix)).reduce((s, f) => s + f.total, 0), [faturas, monthPrefix]);
  const alertasStock = useMemo(() => produtos.filter(p => stockStatus(p) !== "normal"), [produtos]);

  const chartData = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const iso = d.toISOString().slice(0, 10);
      const total = faturas.filter(f => f.data === iso).reduce((s, f) => s + f.total, 0);
      days.push({ dia: iso.slice(8, 10) + "/" + iso.slice(5, 7), total });
    }
    return days;
  }, [faturas]);

  const topProdutos = useMemo(() => {
    const map = {};
    faturas.forEach(f => f.itens.forEach(it => {
      map[it.nome] = (map[it.nome] || 0) + it.qtd;
    }));
    return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([nome, qtd]) => ({ nome, qtd }));
  }, [faturas]);

  /* ---------- product CRUD ---------- */
  function saveProduct(data) {
    if (data.id) {
      setProdutos(prev => prev.map(p => p.id === data.id ? data : p));
    } else {
      setProdutos(prev => [...prev, { ...data, id: uid() }]);
    }
    setProductModal(null);
  }
  function deleteProduct(id) {
    setProdutos(prev => prev.filter(p => p.id !== id));
    setConfirmDelete(null);
  }

  /* ---------- user CRUD ---------- */
  function saveUser(data) {
    if (data.id) {
      setUsuarios(prev => prev.map(u => u.id === data.id ? data : u));
    } else {
      setUsuarios(prev => [...prev, { ...data, id: uid() }]);
    }
    setUserModal(null);
  }
  function deleteUser(id) {
    setUsuarios(prev => prev.filter(u => u.id !== id));
    setConfirmDelete(null);
  }

  /* ---------- invoice creation ---------- */
  function createInvoice({ cliente, itens }) {
    const numero = `FAT-${new Date().getFullYear()}-${String(invoiceCounter).padStart(4, "0")}`;
    const total = itens.reduce((s, i) => s + i.subtotal, 0);
    const nova = { id: uid(), numero, data: today, cliente: cliente || "Cliente Balcão", itens, total, estado: "Emitida" };
    setFaturas(prev => [nova, ...prev]);
    setProdutos(prev => prev.map(p => {
      const item = itens.find(i => i.produtoId === p.id);
      return item ? { ...p, stockAtual: Math.max(0, p.stockAtual - item.qtd) } : p;
    }));
    setInvoiceCounter(c => c + 1);
    setInvoiceModal(false);
  }
  function deleteInvoice(id) {
    const inv = faturas.find(f => f.id === id);
    if (inv) {
      setProdutos(prev => prev.map(p => {
        const item = inv.itens.find(i => i.produtoId === p.id);
        return item ? { ...p, stockAtual: p.stockAtual + item.qtd } : p;
      }));
    }
    setFaturas(prev => prev.filter(f => f.id !== id));
    setConfirmDelete(null);
  }

  if (!loaded) {
    return (
      <div className="w-full flex items-center justify-center" style={{ background: BRAND.bg, minHeight: 600 }}>
        <div className="flex flex-col items-center gap-3">
          <Loader2 className="animate-spin" size={28} style={{ color: BRAND.gold }} />
          <span className="text-sm" style={{ color: BRAND.muted, fontFamily: "'Inter',sans-serif" }}>A carregar dados…</span>
        </div>
      </div>
    );
  }

  const NAV = [
    { id: "dashboard", label: "Dashboard", icon: LayoutDashboard },
    { id: "produtos", label: "Produtos", icon: Package, badge: alertasStock.length || null },
    { id: "faturas", label: "Faturas", icon: FileText },
    { id: "usuarios", label: "Utilizadores", icon: Users },
  ];

  return (
    <div className="w-full flex" style={{ background: BRAND.bg, fontFamily: "'Inter',sans-serif", color: BRAND.text, minHeight: 720 }}>
      <style>{`
        @media print {
          .no-print { display: none !important; }
          #invoice-print-area { display: block !important; position: absolute; inset: 0; background: white; color: #111; }
        }
        #invoice-print-area { display: none; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: ${BRAND.surface3}; border-radius: 8px; }
        select option { background: ${BRAND.surface2}; }
      `}</style>

      {/* Sidebar */}
      <aside className="no-print w-60 flex-shrink-0 flex flex-col" style={{ background: BRAND.sidebar, borderRight: `1px solid ${BRAND.border}` }}>
        <div className="flex items-center gap-3 px-5 py-5" style={{ borderBottom: `1px solid ${BRAND.border}` }}>
          <img src={LOGO_SRC} alt="Pedro Mavakala" className="w-10 h-10 rounded-lg object-cover" />
          <div className="min-w-0">
            <div className="text-sm font-bold truncate" style={{ fontFamily: "'Sora',sans-serif" }}>PEDRO MAVAKALA</div>
            <div className="truncate" style={{ color: BRAND.mutedDark, fontSize: 10.5 }}>Comércio e Prest. de Serviços</div>
          </div>
        </div>

        <nav className="flex-1 px-3 py-4 flex flex-col gap-1">
          {NAV.map(item => {
            const Icon = item.icon;
            const active = view === item.id;
            return (
              <button
                key={item.id}
                onClick={() => setView(item.id)}
                className="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors relative"
                style={{
                  background: active ? BRAND.surface2 : "transparent",
                  color: active ? BRAND.goldLight : BRAND.muted,
                  borderLeft: active ? `2px solid ${BRAND.gold}` : "2px solid transparent",
                }}
              >
                <Icon size={17} />
                {item.label}
                {item.badge ? (
                  <span className="ml-auto font-bold px-1.5 py-0.5 rounded-full" style={{ background: BRAND.danger, color: "#1A0000", fontSize: 10 }}>
                    {item.badge}
                  </span>
                ) : null}
              </button>
            );
          })}
        </nav>

        <div className="px-4 py-4 flex flex-col gap-2" style={{ borderTop: `1px solid ${BRAND.border}` }}>
          {saveError && (
            <div className="px-2 py-1.5 rounded-lg" style={{ background: "rgba(248,113,113,0.1)", color: BRAND.danger, fontSize: 10.5 }}>
              Falha ao guardar dados. A tentar novamente…
            </div>
          )}
          <button
            onClick={() => setConfirmDelete({ type: "reset" })}
            className="flex items-center gap-2 px-2 py-1.5 rounded-lg transition-colors"
            style={{ color: BRAND.mutedDark, fontSize: 11.5 }}
          >
            <RotateCcw size={13} /> Repor dados de exemplo
          </button>
          <div style={{ color: BRAND.mutedDark, fontSize: 10.5 }}>NIF: 5003247112</div>
        </div>
      </aside>

      {/* Main */}
      <div className="no-print flex-1 min-w-0 flex flex-col">
        <header className="flex items-center justify-between px-8 py-5" style={{ borderBottom: `1px solid ${BRAND.border}` }}>
          <div>
            <h1 className="text-xl font-bold" style={{ fontFamily: "'Sora',sans-serif" }}>
              {NAV.find(n => n.id === view)?.label}
            </h1>
            <p className="text-xs mt-0.5" style={{ color: BRAND.mutedDark }}>{formatDatePT(today)}</p>
          </div>
          {view === "produtos" && (
            <Button onClick={() => setProductModal({})}><Plus size={16} /> Novo produto</Button>
          )}
          {view === "faturas" && (
            <Button onClick={() => setInvoiceModal(true)}><Plus size={16} /> Nova fatura</Button>
          )}
          {view === "usuarios" && (
            <Button onClick={() => setUserModal({})}><Plus size={16} /> Novo utilizador</Button>
          )}
        </header>

        <main className="flex-1 overflow-y-auto px-8 py-6">
          {view === "dashboard" && (
            <DashboardView
              vendasHoje={vendasHoje}
              receitaMes={receitaMes}
              produtos={produtos}
              alertasStock={alertasStock}
              chartData={chartData}
              topProdutos={topProdutos}
              faturas={faturas}
              onVerFatura={setPrintingInvoice}
              onIrProdutos={() => setView("produtos")}
            />
          )}
          {view === "produtos" && (
            <ProdutosView
              produtos={produtos}
              onEdit={setProductModal}
              onDelete={(p) => setConfirmDelete({ type: "produto", id: p.id, label: p.nome })}
            />
          )}
          {view === "faturas" && (
            <FaturasView
              faturas={faturas}
              onVer={setPrintingInvoice}
              onDelete={(f) => setConfirmDelete({ type: "fatura", id: f.id, label: f.numero })}
            />
          )}
          {view === "usuarios" && (
            <UsuariosView
              usuarios={usuarios}
              onEdit={setUserModal}
              onDelete={(u) => setConfirmDelete({ type: "usuario", id: u.id, label: u.nome })}
            />
          )}
        </main>
      </div>

      {/* Modals */}
      {productModal !== null && (
        <ProductModal data={productModal} onClose={() => setProductModal(null)} onSave={saveProduct} />
      )}
      {invoiceModal && (
        <InvoiceModal produtos={produtos} onClose={() => setInvoiceModal(false)} onCreate={createInvoice} />
      )}
      {userModal !== null && (
        <UserModal data={userModal} onClose={() => setUserModal(null)} onSave={saveUser} />
      )}
      {confirmDelete && (
        <Modal title={confirmDelete.type === "reset" ? "Repor dados de exemplo" : "Confirmar eliminação"} onClose={() => setConfirmDelete(null)}>
          <p className="text-sm mb-5" style={{ color: BRAND.muted }}>
            {confirmDelete.type === "reset"
              ? "Isto substitui todos os produtos, faturas e utilizadores atuais pelos dados de exemplo. Esta ação não pode ser desfeita."
              : <>Tem a certeza que deseja eliminar <strong style={{ color: BRAND.text }}>{confirmDelete.label}</strong>? Esta ação não pode ser desfeita.</>}
          </p>
          <div className="flex justify-end gap-3">
            <Button variant="secondary" onClick={() => setConfirmDelete(null)}>Cancelar</Button>
            <Button
              variant="danger"
              onClick={() => {
                if (confirmDelete.type === "reset") resetDemo();
                else if (confirmDelete.type === "produto") deleteProduct(confirmDelete.id);
                else if (confirmDelete.type === "fatura") deleteInvoice(confirmDelete.id);
                else if (confirmDelete.type === "usuario") deleteUser(confirmDelete.id);
              }}
            >
              <Trash2 size={15} /> {confirmDelete.type === "reset" ? "Repor" : "Eliminar"}
            </Button>
          </div>
        </Modal>
      )}

      {printingInvoice && (
        <InvoiceViewer invoice={printingInvoice} onClose={() => setPrintingInvoice(null)} />
      )}
    </div>
  );
}

  const filtered = produtos.filter(p => p.nome.toLowerCase().includes(q.toLowerCase()) || p.categoria.toLowerCase().includes(q.toLowerCase()));

  return (
    <Card>
      <div className="flex items-center gap-3 mb-5">
        <div className="relative flex-1 max-w-xs">
          <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: BRAND.mutedDark }} />
          <input
            value={q} onChange={e => setQ(e.target.value)} placeholder="Pesquisar produto ou categoria…"
            className="w-full rounded-lg pl-9 pr-3 py-2 text-sm outline-none"
            style={{ background: BRAND.surface2, border: `1px solid ${BRAND.borderStrong}`, color: BRAND.text }}
          />
        </div>
        <span className="text-xs" style={{ color: BRAND.mutedDark }}>{filtered.length} produto(s)</span>
      </div>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>

function ProductModal({ data, onClose, onSave }) {
  const isEdit = !!data.id;
  const [form, setForm] = useState({
    id: data.id || null,
    nome: data.nome || "",
    categoria: data.categoria || CATEGORIAS[0],
    preco: data.preco ?? "",
    stockAtual: data.stockAtual ?? "",
    stockMin: data.stockMin ?? "",
    stockMax: data.stockMax ?? "",
    unidade: data.unidade || "un",
  });
  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  const valid = form.nome.trim() && form.preco !== "" && form.stockAtual !== "" && form.stockMin !== "" && form.stockMax !== "" && Number(form.stockMin) <= Number(form.stockMax);

  function submit() {
    if (!valid) return;
    onSave({
      ...form,
      preco: Number(form.preco),
      stockAtual: Number(form.stockAtual),
      stockMin: Number(form.stockMin),
      stockMax: Number(form.stockMax),
    });
  }

  return (
    <Modal title={isEdit ? "Editar produto" : "Novo produto"} onClose={onClose}>
      <div className="flex flex-col gap-4">
        <Input label="Nome do produto" value={form.nome} onChange={set("nome")} placeholder="Ex: Resma de Papel A4" />
        <div className="grid grid-cols-2 gap-3">
          <Select label="Categoria" value={form.categoria} onChange={set("categoria")}>
            {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
          </Select>
          <Input label="Unidade" value={form.unidade} onChange={set("unidade")} placeholder="un, folha, kg…" />
        </div>
        <Input label="Preço de venda (Kz)" type="number" min="0" value={form.preco} onChange={set("preco")} placeholder="0" />
        <div className="grid grid-cols-3 gap-3">
          <Input label="Stock atual" type="number" min="0" value={form.stockAtual} onChange={set("stockAtual")} />
          <Input label="Stock mínimo" type="number" min="0" value={form.stockMin} onChange={set("stockMin")} />
          <Input label="Stock máximo" type="number" min="0" value={form.stockMax} onChange={set("stockMax")} />
        </div>
        {Number(form.stockMin) > Number(form.stockMax) && form.stockMax !== "" && (
          <p className="text-xs" style={{ color: BRAND.danger }}>O stock mínimo não pode ser maior que o máximo.</p>
        )}
        <div className="flex justify-end gap-3 mt-2">
          <Button variant="secondary" onClick={onClose}>Cancelar</Button>
          <Button onClick={submit} disabled={!valid}><Save size={15} /> Guardar</Button>
        </div>
      </div>
    </Modal>
  );
}

function InvoiceModal({ produtos, onClose, onCreate }) {
  const [cliente, setCliente] = useState("");
  const [selProduto, setSelProduto] = useState(produtos[0]?.id || "");
  const [qtd, setQtd] = useState(1);
  const [itens, setItens] = useState([]);

  const disponivel = produtos.find(p => p.id === selProduto);
  const jaNoCarrinho = itens.find(i => i.produtoId === selProduto)?.qtd || 0;
  const podeAdicionar = disponivel && Number(qtd) > 0 && (jaNoCarrinho + Number(qtd)) <= disponivel.stockAtual;

  function addItem() {
    if (!podeAdicionar) return;
    setItens(prev => {
      const existing = prev.find(i => i.produtoId === selProduto);
      if (existing) {
        return prev.map(i => i.produtoId === selProduto
          ? { ...i, qtd: i.qtd + Number(qtd), subtotal: (i.qtd + Number(qtd)) * i.precoUnit }
          : i);
      }
      return [...prev, { produtoId: disponivel.id, nome: disponivel.nome, precoUnit: disponivel.preco, qtd: Number(qtd), subtotal: disponivel.preco * Number(qtd) }];
    });
    setQtd(1);
  }
  function removeItem(id) {
    setItens(prev => prev.filter(i => i.produtoId !== id));
  }

  const total = itens.reduce((s, i) => s + i.subtotal, 0);

  return (
    <Modal title="Nova fatura" onClose={onClose} wide>
      <div className="flex flex-col gap-4">
        <Input label="Cliente (opcional)" value={cliente} onChange={e => setCliente(e.target.value)} placeholder="Cliente Balcão" />

        <div className="grid gap-3 items-end p-4 rounded-xl" style={{ background: BRAND.surface2, gridTemplateColumns: "1fr 100px auto" }}>
          <Select label="Produto" value={selProduto} onChange={e => setSelProduto(e.target.value)}>
            {produtos.map(p => (
              <option key={p.id} value={p.id} disabled={p.stockAtual <= 0}>
                {p.nome} — {formatKz(p.preco)} ({p.stockAtual} {p.unidade} disp.)
              </option>
            ))}
          </Select>
          <Input label="Qtd" type="number" min="1" value={qtd} onChange={e => setQtd(e.target.value)} />
          <Button onClick={addItem} disabled={!podeAdicionar}><Plus size={15} /> Adicionar</Button>
        </div>
        {disponivel && !podeAdicionar && Number(qtd) > 0 && (
          <p className="text-xs -mt-2" style={{ color: BRAND.danger }}>Quantidade indisponível em stock.</p>
        )}

        <div className="rounded-xl overflow-hidden" style={{ border: `1px solid ${BRAND.border}` }}>
          <table className="w-full text-sm">
            <thead>
              <tr className="text-left uppercase" style={{ background: BRAND.surface2, color: BRAND.mutedDark, fontSize: 11 }}>
                <th className="px-4 py-2.5 font-medium">Produto</th>
                <th className="px-4 py-2.5 font-medium">Qtd</th>
                <th className="px-4 py-2.5 font-medium">Subtotal</th>
                <th className="px-4 py-2.5 font-medium"></th>
              </tr>
            </thead>
            <tbody>
              {itens.map(i => (
                <tr key={i.produtoId} style={{ borderTop: `1px solid ${BRAND.border}` }}>
                  <td className="px-4 py-2.5">{i.nome}</td>
                  <td className="px-4 py-2.5">{i.qtd}</td>
                  <td className="px-4 py-2.5">{formatKz(i.subtotal)}</td>
                  <td className="px-4 py-2.5 text-right">
                    <button onClick={() => removeItem(i.produtoId)} style={{ color: BRAND.danger }}><X size={15} /></button>
                  </td>
                </tr>
              ))}
              {itens.length === 0 && (
                <tr><td colSpan={4} className="px-4 py-6 text-center text-xs" style={{ color: BRAND.mutedDark }}>Sem itens adicionados.</td></tr>
              )}
            </tbody>
          </table>
        </div>

        <div className="flex items-center justify-between pt-2">
          <span className="text-sm font-medium" style={{ color: BRAND.muted }}>Total</span>
          <span className="text-xl font-bold" style={{ fontFamily: "'Sora',sans-serif", color: BRAND.goldLight }}>{formatKz(total)}</span>
        </div>

        <div className="flex justify-end gap-3">
          <Button variant="secondary" onClick={onClose}>Cancelar</Button>
          <Button disabled={itens.length === 0} onClick={() => onCreate({ cliente, itens })}><FileText size={15} /> Emitir fatura</Button>
        </div>
      </div>
    </Modal>
  );
}
