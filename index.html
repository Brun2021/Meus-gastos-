<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus Gastos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meus Gastos">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e5e7eb;--ac:#0f766e;--out:#dc2626;--in:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1317;--card:#1a1f26;--tx:#e8eaed;--mut:#9aa3af;--bd:#2a313a;--ac:#2dd4bf;--out:#f87171;--in:#4ade80}}
:root[data-theme="dark"]{--bg:#0f1317;--card:#1a1f26;--tx:#e8eaed;--mut:#9aa3af;--bd:#2a313a;--ac:#2dd4bf;--out:#f87171;--in:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.hd{max-width:760px;margin:0 auto;padding:12px 14px 0}h1{font-size:20px;margin:0 0 10px}h2{font-size:15px;margin:0 0 10px}
main{max-width:760px;margin:0 auto;padding:12px 14px 120px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 120px}
input,select,button,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.on{background:var(--ac);color:#fff}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.nav b{text-align:center;text-transform:capitalize}.nav button{flex:0 0 46px}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.k small{color:var(--mut);display:block}.k strong{font-size:16px}
.o{color:var(--out)}.i{color:var(--in)}.m{color:var(--mut)}small.m{font-size:12px}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}.lg{flex:1 1 180px;font-size:13px}
.lg div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.col{display:flex;align-items:flex-end;gap:3px;height:120px;overflow-x:auto}
.cl{flex:1;min-width:9px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.cl div{width:100%;background:var(--out);border-radius:3px 3px 0 0;opacity:.85}.cl small{font-size:9px;color:var(--mut)}
.pb{height:9px;border-radius:5px;background:var(--bd);overflow:hidden;margin:4px 0}.pb i{display:block;height:100%;background:var(--ac)}
.tip{background:var(--bg);border-radius:10px;padding:10px;font-size:14px;margin-top:10px}
.tx{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}.tx:first-child{border-top:0}
.tx small{color:var(--mut);display:block}.tx button{padding:3px 9px;margin-left:4px;background:transparent;color:var(--mut);border:1px solid var(--bd);font-weight:400}
.bn{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bn button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:8px 0;font-size:18px;line-height:1.1}.bn button small{display:block;font-size:11px}.bn button.on{color:var(--ac)}
#fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 14px #0004;z-index:6}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:10}.md[hidden]{display:none}
.sh{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
textarea{width:100%;height:90px;font-size:12px}
</style>
</head>
<body>
<header class="hd"><h1>💰 Meus Gastos</h1>
<div class="seg"><button data-p="d">Dia</button><button data-p="w">Semana</button><button data-p="m">Mês</button></div>
<div class="nav"><button class="g" id="pv">‹</button><b id="lb"></b><button class="g" id="nx">›</button></div></header>
<main>
<section id="t-pn">
<div class="c"><div class="k"><div><small>Entrou</small><strong class="i" id="kin"></strong></div><div><small>Saiu</small><strong class="o" id="kout"></strong></div><div><small>Saldo</small><strong id="kbal"></strong></div></div>
<div class="m" id="vr" style="text-align:center;font-size:13px;margin-top:8px"></div></div>
<div class="c"><h2>Gastos por categoria</h2><div class="dn" id="dn"></div><div class="tip" id="tip"></div></div>
<div class="c"><h2>Gastos por dia</h2><div class="col" id="days"></div></div>
</section>
<section id="t-rg" hidden>
<div class="c"><div class="row"><input id="q" placeholder="🔍 Pesquisar nota ou cartão"><select id="fc"></select></div></div>
<div class="c" id="list"></div>
</section>
<section id="t-ct" hidden>
<div id="cards"></div>
<div class="c"><h2>Novo cartão / conta</h2><div class="row"><input id="nc" placeholder="Nome (ex: Visa BAI)"><select id="nt2"><option>Débito</option><option>Crédito</option><option>Conta</option><option>Dinheiro</option><option>Carteira digital</option></select><input id="nl" type="number" inputmode="decimal" placeholder="Limite (opcional)"></div><button id="ac" style="margin-top:8px;width:100%">Adicionar</button></div>
</section>
<section id="t-or" hidden>
<div class="c"><h2>Orçamento mensal</h2><small class="m" id="ol"></small><div id="orl"></div></div>
<div class="c"><h2>Definições e backup</h2><div class="row" style="align-items:center"><span>Moeda</span><input id="cur" style="max-width:90px"></div>
<p class="m" style="font-size:13px">Para levar os dados para outro aparelho: gera o backup, copia o texto e cola-o lá em “Restaurar”.</p>
<textarea id="bk" placeholder="Backup aparece aqui / cola aqui para restaurar"></textarea>
<div class="row" style="margin-top:8px"><button class="g" id="gb">Gerar backup</button><button id="rb">Restaurar</button></div><small class="m" id="bm"></small></div>
</section>
</main>
<button id="fab">+</button>
<nav class="bn"><button data-t="pn">📊<small>Painel</small></button><button data-t="rg">🧾<small>Registos</small></button><button data-t="ct">💳<small>Cartões</small></button><button data-t="or">🎯<small>Orçamento</small></button></nav>
<div class="md" id="md" hidden><div class="sh"><h2 id="ttl"></h2>
<div class="row"><select id="tp"><option value="s">Saída (gasto)</option><option value="e">Entrada</option></select><input id="vl" type="number" inputmode="decimal" placeholder="Valor"></div>
<div class="row"><select id="ct"></select><select id="cd"></select></div>
<div class="row"><input id="dt" type="date"><input id="nt" placeholder="Nota (opcional)"></div>
<div class="row"><button class="g" id="cx">Cancelar</button><button id="sv">Guardar</button></div></div></div>
<script>
var CATS=["Alimentação","Transporte","Casa","Contas","Saúde","Educação","Lazer","Compras","Outros"],COL=["#0f766e","#2563eb","#d97706","#7c3aed","#dc2626","#0891b2","#db2777","#65a30d","#6b7280"];
var S={tx:[],cards:[{n:"Dinheiro",t:"Dinheiro",l:0}],cur:"Kz",bud:{}},per="m",off=0,tab="pn",eid=null;
try{var r=localStorage.getItem("gastos_v1");if(r)S=JSON.parse(r)}catch(e){}
function norm(){S.cards=(S.cards||[]).map(function(c){return typeof c=="string"?{n:c,t:"Conta",l:0}:c});if(!S.cards.length)S.cards=[{n:"Dinheiro",t:"Dinheiro",l:0}];S.bud=S.bud||{};S.tx=S.tx||[];S.cur=S.cur||"Kz"}norm();
function save(){try{localStorage.setItem("gastos_v1",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fm(n){return n.toLocaleString("pt-PT",{maximumFractionDigits:2})+" "+S.cur}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function col(k){var i=CATS.indexOf(k);return COL[i<0?8:i]}
function range(o){var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());var a,b,l;
if(per=="d"){a=new Date(t);a.setDate(a.getDate()+o);b=a;l=a.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"short"})}
else if(per=="w"){a=new Date(t);a.setDate(a.getDate()-((a.getDay()+6)%7)+o*7);b=new Date(a);b.setDate(b.getDate()+6);l=a.toLocaleDateString("pt-PT",{day:"numeric",month:"short"})+" – "+b.toLocaleDateString("pt-PT",{day:"numeric",month:"short"})}
else{a=new Date(t.getFullYear(),t.getMonth()+o,1);b=new Date(a.getFullYear(),a.getMonth()+1,0);l=a.toLocaleDateString("pt-PT",{month:"long",year:"numeric"})}
return{a:iso(a),b:iso(b),l:l,s:a,e:b}}
function inR(R){return S.tx.filter(function(x){return x.d>=R.a&&x.d<=R.b})}
function sum(L){var m={i:0,o:0,cat:{},day:{}};L.forEach(function(x){if(x.t=="e")m.i+=x.v;else{m.o+=x.v;m.cat[x.c]=(m.cat[x.c]||0)+x.v;m.day[x.d]=(m.day[x.d]||0)+x.v}});return m}
function fill(){$("ct").innerHTML=CATS.map(function(c){return"<option>"+c+"</option>"}).join("");
var o=S.cards.map(function(c){return"<option>"+esc(c.n)+"</option>"}).join("");$("cd").innerHTML=o;
$("fc").innerHTML='<option value="">Todas as categorias</option>'+CATS.map(function(c){return"<option>"+c+"</option>"}).join("")+"<option value='__e'>Entradas</option>"}
function rPn(R,M){
$("kin").textContent=fm(M.i);$("kout").textContent=fm(M.o);var b=$("kbal");b.textContent=fm(M.i-M.o);b.className=M.i-M.o<0?"o":"i";
var P=sum(inR(range(off-1))),v=$("vr");
v.innerHTML=P.o>0?(M.o>P.o?'<span class="o">▲ '+Math.round((M.o-P.o)/P.o*100)+"% mais gastos</span>":'<span class="i">▼ '+Math.round((P.o-M.o)/P.o*100)+"% menos gastos</span>")+" que o período anterior":"";
var ks=Object.keys(M.cat).sort(function(a,b){return M.cat[b]-M.cat[a]}),cum=0,s="";
if(!ks.length){$("dn").innerHTML='<small class="m">Sem gastos neste período.</small>';$("tip").style.display="none"}
else{s='<svg viewBox="0 0 36 36" width="160" height="160" style="transform:rotate(0)"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--bd)" stroke-width="5"/>';
ks.forEach(function(k){var p=M.cat[k]/M.o*100;s+='<circle cx="18" cy="18" r="15.9155" fill="none" stroke="'+col(k)+'" stroke-width="5" stroke-dasharray="'+p+" "+(100-p)+'" stroke-dashoffset="'+(25-cum)+'"/>';cum+=p});
s+='<text x="18" y="17.5" text-anchor="middle" font-size="3" fill="var(--mut)">Gastos</text><text x="18" y="21.5" text-anchor="middle" font-size="4" font-weight="700" fill="var(--tx)">'+M.o.toLocaleString("pt-PT",{notation:"compact",maximumFractionDigits:1})+"</text></svg>";
s+='<div class="lg">'+ks.map(function(k){return"<div><span><i style='background:"+col(k)+"'></i>"+k+"</span><span>"+fm(M.cat[k])+" · "+Math.round(M.cat[k]/M.o*100)+"%</span></div>"}).join("")+"</div>";
$("dn").innerHTML=s;var t=ks[0];$("tip").style.display="block";
$("tip").textContent="💡 "+t+" pesa "+Math.round(M.cat[t]/M.o*100)+"% dos teus gastos. Cortar 10% aqui poupa "+fm(M.cat[t]*0.1)+(ks[1]?". Depois olha para "+ks[1]+".":".")}
var ds=[],d=new Date(R.s);while(d<=R.e&&ds.length<62){ds.push(iso(d));d.setDate(d.getDate()+1)}
var mx=Math.max.apply(null,ds.map(function(k){return M.day[k]||0}).concat([1]));
$("days").innerHTML=ds.map(function(k){var q=M.day[k]||0;return'<div class="cl" title="'+k+": "+fm(q)+'"><div style="height:'+(q?Math.max(3,q/mx*88):1)+'%"></div><small>'+(+k.slice(8))+"</small></div>"}).join("")}
function rRg(R){var q=$("q").value.toLowerCase(),f=$("fc").value;
var L=inR(R).filter(function(x){return(!f||(f=="__e"?x.t=="e":x.c==f&&x.t=="s"))&&(!q||(x.n+" "+x.k+" "+x.c).toLowerCase().indexOf(q)>=0)}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id});
$("list").innerHTML=L.length?L.map(function(x){return'<div class="tx"><div><b>'+(x.t=="e"?"Entrada":x.c)+"</b><small>"+x.d.split("-").reverse().join("/")+" · "+esc(x.k)+(x.n?" · "+esc(x.n):"")+'</small></div><div style="text-align:right"><b class="'+(x.t=="e"?"i":"o")+'">'+(x.t=="e"?"+":"−")+fm(x.v)+'</b><br><button data-e="'+x.id+'">editar</button><button data-x="'+x.id+'">apagar</button></div></div>'}).join(""):'<small class="m">Nada encontrado.</small>'}
function rCt(R){$("cards").innerHTML=S.cards.map(function(c,ix){var a=0,o=0,ti=0,to=0;S.tx.forEach(function(x){if(x.k!=c.n)return;if(x.t=="e")ti+=x.v;else to+=x.v;if(x.d>=R.a&&x.d<=R.b){if(x.t=="e")a+=x.v;else o+=x.v}});
var bal=ti-to,lim=c.l>0?'<div class="pb"><i style="width:'+Math.min(100,o/c.l*100)+'%;background:'+(o>c.l?"var(--out)":"var(--ac)")+'"></i></div><small class="m">Gasto no período: '+fm(o)+" de "+fm(c.l)+"</small>":"";
return'<div class="c"><div class="row" style="justify-content:space-between;align-items:center"><div style="flex:1 1 auto"><b>💳 '+esc(c.n)+'</b> <small class="m">'+esc(c.t)+'</small></div><button class="g" style="flex:0 0 auto;padding:4px 10px" data-d="'+ix+'">remover</button></div><div class="k" style="margin-top:8px"><div><small>Entrou</small><b class="i">'+fm(a)+'</b></div><div><small>Saiu</small><b class="o">'+fm(o)+'</b></div><div><small>Saldo total</small><b class="'+(bal<0?"o":"i")+'">'+fm(bal)+"</b></div></div>"+lim+"</div>"}).join("")}
function rOr(R){var M=sum(S.tx.filter(function(x){return x.d.slice(0,7)==R.a.slice(0,7)})),tb=0;
$("ol").textContent="Mês de "+R.s.toLocaleDateString("pt-PT",{month:"long",year:"numeric"})+" · define quanto queres gastar por categoria.";
$("orl").innerHTML=CATS.map(function(c){var b=+S.bud[c]||0,sp=M.cat[c]||0,p=b?sp/b*100:0;tb+=b;
return'<div style="margin:12px 0"><div class="row" style="align-items:center"><b style="flex:1 1 90px">'+c+'</b><input type="number" inputmode="decimal" data-b="'+c+'" value="'+(b||"")+'" placeholder="Orçamento" style="flex:1 1 100px"></div>'+(b?'<div class="pb"><i style="width:'+Math.min(100,p)+"%;background:"+(p>100?"var(--out)":p>80?"#d97706":"var(--ac)")+'"></i></div><small class="'+(p>100?"o":"m")+'">'+fm(sp)+" de "+fm(b)+" ("+Math.round(p)+"%)"+(p>100?" · acima do limite!":p>80?" · quase no limite":"")+"</small>":(sp?'<small class="m">Gasto: '+fm(sp)+"</small>":""))+"</div>"}).join("")+'<b>Total orçado: '+fm(tb)+"</b>"}
function render(){var R=range(off),M=sum(inR(R));$("lb").textContent=R.l;
document.querySelectorAll(".seg button").forEach(function(b){b.className=b.dataset.p==per?"on":"g"});
document.querySelectorAll(".bn button").forEach(function(b){b.className=b.dataset.t==tab?"on":""});
["pn","rg","ct","or"].forEach(function(t){$("t-"+t).hidden=t!=tab});
if(tab=="pn")rPn(R,M);if(tab=="rg")rRg(R);if(tab=="ct")rCt(R);if(tab=="or")rOr(R)}
function openM(x){eid=x?x.id:null;$("ttl").textContent=x?"Editar registo":"Novo registo";$("tp").value=x?x.t:"s";$("vl").value=x?x.v:"";$("ct").value=x?x.c:CATS[0];$("cd").value=x?x.k:S.cards[0].n;$("dt").value=x?x.d:iso(new Date());$("nt").value=x?x.n:"";$("ct").disabled=$("tp").value=="e";$("md").hidden=false}
$("fab").onclick=function(){openM()};$("cx").onclick=function(){$("md").hidden=true};
$("tp").onchange=function(){$("ct").disabled=this.value=="e"};
$("sv").onclick=function(){var v=parseFloat($("vl").value);if(!(v>0)){$("vl").focus();return}
var o={id:eid||Date.now(),t:$("tp").value,v:v,c:$("ct").value,k:$("cd").value,d:$("dt").value||iso(new Date()),n:$("nt").value.trim()};
if(eid)S.tx=S.tx.map(function(x){return x.id==eid?o:x});else S.tx.push(o);save();$("md").hidden=true;render()};
$("list").onclick=function(e){var d=e.target.dataset;if(d.x&&confirm("Apagar este registo?")){S.tx=S.tx.filter(function(x){return x.id!=d.x});save();render()}
if(d.e){openM(S.tx.filter(function(x){return x.id==d.e})[0])}};
$("q").oninput=render;$("fc").onchange=render;
$("ac").onclick=function(){var n=$("nc").value.trim();if(n&&!S.cards.some(function(c){return c.n==n})){S.cards.push({n:n,t:$("nt2").value,l:+$("nl").value||0});$("nc").value="";$("nl").value="";save();fill();render()}};
$("cards").onclick=function(e){var i=e.target.dataset.d;if(i!=null&&S.cards.length>1&&confirm("Remover este cartão? Os registos ficam guardados.")){S.cards.splice(+i,1);save();fill();render()}};
$("orl").onchange=function(e){var c=e.target.dataset.b;if(c){S.bud[c]=+e.target.value||0;save();render()}};
document.querySelectorAll(".seg button").forEach(function(b){b.onclick=function(){per=b.dataset.p;off=0;render()}});
document.querySelectorAll(".bn button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;render();scrollTo(0,0)}});
$("pv").onclick=function(){off--;render()};$("nx").onclick=function(){off++;render()};
$("cur").value=S.cur;$("cur").onchange=function(){S.cur=$("cur").value||"Kz";save();render()};
$("gb").onclick=function(){var t=$("bk");t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value);$("bm").textContent="Backup gerado e copiado."}catch(e){$("bm").textContent="Backup gerado. Copia o texto."}};
$("rb").onclick=function(){try{var o=JSON.parse($("bk").value);if(!o.tx)throw 0;if(!confirm("Substituir os dados deste aparelho?"))return;S=o;norm();save();fill();$("cur").value=S.cur;$("bm").textContent="Restaurado!";render()}catch(e){$("bm").textContent="Backup inválido."}};
fill();render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
